site_name: JAX-Aero
site_description: Compressible Euler, Navier-Stokes and SA RANS on structured grids in JAX, 2D and 3D
site_url: https://giovannicatalani.github.io/jaxaero/
repo_url: https://github.com/giovannicatalani/jaxaero
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
